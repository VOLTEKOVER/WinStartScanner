name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish release
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute next version
        id: ver
        run: node scripts/bump-version.mjs

      - name: Cache electron-builder
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron-builder/Cache
          key: electron-builder-${{ runner.os }}-v1

      - name: Prepare winCodeSign cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:LOCALAPPDATA 'electron-builder\Cache\winCodeSign'
          $target = Join-Path $cache 'winCodeSign-2.6.0'
          if (Test-Path (Join-Path $target 'rcedit-ia32.exe')) {
            Write-Host 'winCodeSign cache already present'
            return
          }
          try {
            $url = 'https://github.com/electron-userland/electron-builder-binaries/releases/download/winCodeSign-2.6.0/winCodeSign-2.6.0.7z'
            $archive = Join-Path $env:TEMP 'winCodeSign-2.6.0.7z'
            Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
            $extract = Join-Path $env:TEMP 'wcs-extract'
            if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $extract | Out-Null
            $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
            & $sevenZip x $archive "-o$extract" -y | Out-Null
            $src = $extract
            $nested = Join-Path $extract 'winCodeSign-2.6.0'
            if (Test-Path $nested) { $src = $nested }
            New-Item -ItemType Directory -Force -Path $cache | Out-Null
            if (Test-Path $target) { Remove-Item $target -Recurse -Force }
            Move-Item $src $target
            foreach ($rel in @('darwin\10.12\lib\libcrypto.dylib', 'darwin\10.12\lib\libssl.dylib')) {
              $f = Join-Path $target $rel
              if (-not (Test-Path $f)) {
                New-Item -ItemType Directory -Force -Path (Split-Path $f -Parent) | Out-Null
                New-Item -ItemType File -Path $f -Force | Out-Null
              }
            }
            if (-not (Test-Path (Join-Path $target 'rcedit-ia32.exe'))) { throw 'rcedit-ia32.exe not found after extraction' }
            Write-Host 'winCodeSign cache prepared'
          } catch {
            Write-Warning "winCodeSign prep failed: $_"
            if (Test-Path $target) { Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue }
          }

      - name: Build frontend
        run: npm run generate

      - name: Build Windows installer
        run: npx electron-builder --win --publish never

      - name: Create release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = "${{ steps.ver.outputs.version }}"
          $dir = 'dist-electron'
          $built = Join-Path $dir "WinStartScanner Setup $ver.exe"
          if (-not (Test-Path $built)) {
            $found = Get-ChildItem $dir -Filter "*$ver*.exe" -File | Select-Object -First 1
            if (-not $found) { throw "No installer found for v$ver" }
            $built = $found.FullName
          }
          $exe = Join-Path $dir "WinStartScanner-Setup-$ver.exe"
          Copy-Item $built $exe -Force
          $bm = Join-Path $dir "WinStartScanner-Setup-$ver.exe.blockmap"
          if (Test-Path ($built + '.blockmap')) { Copy-Item ($built + '.blockmap') $bm -Force }

          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $commitMsg = ((git log -1 --pretty=%B) -join "`n").Trim()
          $notes = @"
          # WinStartScanner $ver

          Build automatico dal commit ``$sha``.

          ## Changelog

          $commitMsg

          ## Installazione

          Scarica ``WinStartScanner-Setup-$ver.exe`` ed eseguilo per installare o aggiornare l'app.

          ## Requisiti

          - Windows 10 / 11
          - (opzionale) CLI **OpenCode** per le funzioni AI

          > SmartScreen può mostrare un avviso perché l'eseguibile non è firmato digitalmente: clicca su **Altre informazioni** → **Esegui comunque**.
          "@
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'release-notes.md'), $notes)

          $assets = @($exe)
          if (Test-Path $bm) { $assets += $bm }
          $yml = Join-Path $dir 'latest.yml'
          if (Test-Path $yml) { $assets += $yml }

          gh release create "v$ver" @assets --title "WinStartScanner $ver" --notes-file 'release-notes.md' --target "$env:GITHUB_SHA"
